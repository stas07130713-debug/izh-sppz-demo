<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 183" role="img" aria-label="F07 Пожарный водоисточник">
  <!--
    Знак F07 «Пожарный водоисточник» по ГОСТ Р 12.4.026, срисован с образца.

    Устройство рисунка: слева фланец с двумя угольниками и раструб, из него
    вправо и вниз идёт членённый рукав четвертью круга, оканчивается расширенным
    носком в воде. Ниже — волна и три ряда штрихов дна.

    Рисунок собран маской, а не белыми фигурами поверх поля: рукав членённый, и
    между звеньями должно быть видно само поле. В маске прорези чёрные, то есть
    просто дырки — сквозь них виден фон, каким бы он ни был.
  -->
  <defs>
    <mask id="f07">
      <!-- Рукав: полоса ровной толщины между окружностями вокруг точки (61.9, 126.3). -->
      <path d="M61.9 41.1 A85.2 85.2 0 0 1 147.1 126.3 L130.1 126.3 A68.2 68.2 0 0 0 61.9 58.1 Z" fill="#fff"/>
      <!-- Носок рукава: расширяется книзу, уходит в воду. -->
      <path d="M128.6 132 L148.6 132 L154 158 L123 158 Z" fill="#fff"/>
      <!-- Раструб: широкий у фланца, узкий у рукава. -->
      <path d="M45 34 L57 41 Q62 48 62 58 L52 70 L45 78 Z" fill="#fff"/>
      <!-- Фланец и два угольника. -->
      <rect x="38" y="34" width="7" height="44" fill="#fff"/>
      <path d="M30 34 h15 v4 h-11 v8 h-4 z" fill="#fff"/>
      <path d="M30 78 h15 v-4 h-11 v-8 h-4 z" fill="#fff"/>
      <!-- Прорези: членение рукава. -->
      <g stroke="#000" stroke-width="3.5" stroke-linecap="butt">
        <path d="M70.8 62.9 L74.3 38.2"/>
        <path d="M79.5 64.8 L86.4 40.7"/>
        <path d="M87.9 67.8 L98.1 45.0"/>
        <path d="M95.8 72.0 L109.1 50.8"/>
        <path d="M103.0 77.3 L119.1 58.1"/>
        <path d="M109.5 83.5 L128.0 66.7"/>
        <path d="M114.9 90.5 L135.7 76.5"/>
        <path d="M119.4 98.2 L141.9 87.3"/>
        <path d="M122.8 106.5 L146.5 98.8"/>
        <path d="M124.9 115.2 L149.5 110.9"/>
      </g>
    </mask>
  </defs>

  <rect width="188" height="183" fill="#fff"/>
  <rect x="21" y="22" width="146" height="139" fill="#e1251b"/>
  <rect x="21" y="22" width="146" height="139" fill="#fff" mask="url(#f07)"/>

  <!-- Вода: одна мелкая волна, слева до рукава и коротким куском справа от него. -->
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
    <path d="M27 108q4-4 8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0"/>
    <path d="M150 106q4-4 8 0t8 0"/>
  </g>

  <!-- Дно: три ряда штрихов, неровных по длине и положению — как на знаке. -->
  <g fill="#fff">
    <rect x="28" y="119" width="12" height="5"/>
    <rect x="53" y="119" width="13" height="5"/>
    <rect x="82" y="119" width="14" height="5"/>
    <rect x="111" y="119" width="6" height="5"/>
    <rect x="152" y="119" width="11" height="5"/>
    <rect x="41" y="131" width="8" height="5"/>
    <rect x="69" y="131" width="7" height="5"/>
    <rect x="97" y="131" width="6" height="5"/>
    <rect x="25" y="143" width="6" height="5"/>
    <rect x="56" y="143" width="9" height="5"/>
    <rect x="85" y="143" width="8" height="5"/>
  </g>
</svg>
