<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 183" role="img" aria-label="Огнезащитная обработка">
  <!--
    Значок огнезащитной обработки: балка под слоем покрытия и пламя,
    отражённое от неё.

    Не знак безопасности: в ГОСТ Р 12.4.026 такого знака нет — огнезащита не
    место и не средство, а состояние конструкции. Поэтому значок сделан в том
    же виде, что остальные значки каталога, и цветом отличается от красных
    знаков, чтобы на плане его не приняли за средство пожаротушения.
  -->
  <rect width="188" height="183" fill="#fff"/>
  <rect x="21" y="22" width="146" height="139" rx="4" fill="#15803d"/>

  <!-- Защищаемая балка: двутавр в разрезе. -->
  <g fill="#fff">
    <rect x="52" y="96" width="84" height="12" rx="2"/>
    <rect x="86" y="96" width="16" height="44"/>
    <rect x="52" y="128" width="84" height="12" rx="2"/>
  </g>

  <!-- Слой огнезащиты поверх балки: пунктирная кромка. -->
  <path d="M46 88h96" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"
    stroke-dasharray="14 9"/>

  <!-- Пламя, отражённое слоем: вверх оно не проходит. -->
  <path d="M94 40c14 12 20 22 20 30 0 12-9 20-20 20s-20-8-20-20c0-8 6-18 20-30z" fill="#fff"/>
  <path d="M94 58c6 6 9 11 9 15 0 6-4 10-9 10s-9-4-9-10c0-4 3-9 9-15z" fill="#15803d"/>
</svg>
