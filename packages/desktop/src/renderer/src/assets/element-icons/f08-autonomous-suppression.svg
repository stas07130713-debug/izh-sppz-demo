<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 183" role="img" aria-label="Модульная автономная установка пожаротушения">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="188" height="183" fill="#fff"/>
  <rect x="17" y="18" width="154" height="147" rx="6" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="21" y="22" width="146" height="139" rx="4" fill="url(#a)" stroke="#fff" stroke-width="2"/>

  <!-- Модуль: баллон с распылителем внизу. Автономность показана тем, что от
       модуля не идёт линия к прибору — он срабатывает сам. -->
  <g fill="#fff">
    <rect x="78" y="52" width="32" height="58" rx="14"/>
    <rect x="88" y="42" width="12" height="12" rx="3"/>
  </g>

  <!-- Купол распыла -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <path d="M60 130c8-14 20-20 34-20s26 6 34 20"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <path d="M66 142v10"/><path d="M82 146v10"/><path d="M94 148v10"/>
    <path d="M106 146v10"/><path d="M122 142v10"/>
  </g>
</svg>
